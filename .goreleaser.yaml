version: 2

project_name: vmrc

before:
  hooks:
    # Read-only: ensure modules are present without mutating go.mod/go.sum on the
    # release runner (a `go mod tidy` here could rewrite them mid-release).
    - go mod download

builds:
  - id: vmrc
    main: ./cmd/vmrc
    binary: vmrc
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

  - id: vmrc-agent
    main: ./cmd/vmrc-agent
    binary: vmrc-agent
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

# One archive per binary (each selects a single build id) so the {{ .Binary }}
# name template is unambiguous: vmrc_<ver>_<os>_<arch> and vmrc-agent_<ver>_<os>_<arch>.
archives:
  - id: vmrc
    builds: [vmrc]
    format: tar.gz
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
  - id: vmrc-agent
    builds: [vmrc-agent]
    format: tar.gz
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  # use: git keeps the entry format "{{ .SHA }} {{ .Message }}" — short hash + subject,
  # no author name/email (the github backend appends "(author <email>)"). abbrev shortens
  # the hash; groups/filters tidy the list (conventional-commit prefixes).
  use: git
  sort: asc
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    # Drop merge commits (they duplicate the underlying feat/fix/docs commits) and
    # low-signal types, so the changelog reads as a clean per-change summary.
    exclude:
      - '^Merge '
      - '^chore(\([[:word:]]+\))??!?:'
      - '^ci(\([[:word:]]+\))??!?:'
      - '^test(\([[:word:]]+\))??!?:'
      - '^refactor(\([[:word:]]+\))??!?:'

release:
  github:
    owner: pddstudio
    name: vmrc
  draft: false
  prerelease: auto
