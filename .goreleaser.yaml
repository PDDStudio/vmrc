version: 2

project_name: vmrc

before:
  hooks:
    # Read-only: ensure modules are present without mutating go.mod/go.sum on the
    # release runner (a `go mod tidy` here could rewrite them mid-release).
    - go mod download

builds:
  - id: vmrc
    main: ./cmd/vmrc
    binary: vmrc
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

  - id: vmrc-agent
    main: ./cmd/vmrc-agent
    binary: vmrc-agent
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

# One archive per binary (each selects a single build id) so the {{ .Binary }}
# name template is unambiguous: vmrc_<ver>_<os>_<arch> and vmrc-agent_<ver>_<os>_<arch>.
archives:
  - id: vmrc
    ids: [vmrc]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
  - id: vmrc-agent
    ids: [vmrc-agent]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Sign checksums.txt -> checksums.txt.sig (ed25519, format documented in
# internal/selfupdate/signature.go). Binaries refuse to self-update to a release
# without a valid signature by an embedded key (internal/selfupdate/keys/*.pub).
# The private key comes only from the VMRC_RELEASE_SIGNING_KEY secret
# (release.yml); `sign` also fails if that key is not one of the embedded keys.
# The variable reaches the command because goreleaser runs sign commands with its
# own process environment; no `env:` entry is needed (and a `{{ .Env.X }}`
# entry there would not resolve, since sign env templates only see earlier
# entries of the same list). The tool fails clearly when the variable is unset.
# `goreleaser build --snapshot` (CI) never runs this pipe, so CI needs no secret.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./tools/releasesign", "sign", "-in", "${artifact}", "-out", "${signature}"]
    signature: "${artifact}.sig"

changelog:
  # use: git keeps the entry format "{{ .SHA }} {{ .Message }}" — short hash + subject,
  # no author name/email (the github backend appends "(author <email>)"). abbrev shortens
  # the hash; groups/filters tidy the list (conventional-commit prefixes).
  use: git
  sort: asc
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    # Drop merge commits (they duplicate the underlying feat/fix/docs commits) and
    # low-signal types, so the changelog reads as a clean per-change summary.
    exclude:
      - '^Merge '
      - '^chore(\([[:word:]]+\))??!?:'
      - '^ci(\([[:word:]]+\))??!?:'
      - '^test(\([[:word:]]+\))??!?:'
      - '^refactor(\([[:word:]]+\))??!?:'

release:
  github:
    owner: pddstudio
    name: vmrc
  draft: false
  prerelease: auto
