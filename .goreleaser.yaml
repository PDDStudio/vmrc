version: 2

project_name: vmrc

before:
  hooks:
    # Read-only: ensure modules are present without mutating go.mod/go.sum on the
    # release runner (a `go mod tidy` here could rewrite them mid-release).
    - go mod download

builds:
  - id: vmrc
    main: ./cmd/vmrc
    binary: vmrc
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

  - id: vmrc-agent
    main: ./cmd/vmrc-agent
    binary: vmrc-agent
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

# One archive per binary (each selects a single build id) so the {{ .Binary }}
# name template is unambiguous: vmrc_<ver>_<os>_<arch> and vmrc-agent_<ver>_<os>_<arch>.
archives:
  - id: vmrc
    builds: [vmrc]
    format: tar.gz
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
  - id: vmrc-agent
    builds: [vmrc-agent]
    format: tar.gz
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  github:
    owner: pddstudio
    name: vmrc
  draft: false
  prerelease: auto
