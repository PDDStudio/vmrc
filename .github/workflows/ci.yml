name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The prebuilt golangci-lint binary is built with an older Go and refuses
      # to analyze this go1.27 module, so build it from source via `go run`
      # under the toolchain setup-go installed.
      - name: Lint
        env:
          GOTOOLCHAIN: go1.27.3
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      # Fails only on vulnerabilities reachable from our code; advisories in
      # required-but-uncalled modules are reported but do not fail the job.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Cross-build matrix (snapshot)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: build --snapshot --clean

  # The service, scheduled-task, ACL, capture and input code is Windows-only and
  # the launchd paths are macOS-only; cross-compiling proves they build, these
  # jobs prove they work.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # -race needs cgo; the Windows runner's default toolchain has no C compiler
      # on PATH, so race-test on macOS only.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then go test -race ./...; else go test ./...; fi

      - name: Lint (Windows-tagged code)
        if: runner.os == 'Windows'
        env:
          GOTOOLCHAIN: go1.27.3
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
