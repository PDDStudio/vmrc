name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, no leading v (e.g. 0.2.0 or 0.2.0-rc1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write          # OIDC token for build-provenance attestations
  attestations: write
  artifact-metadata: write

# One release at a time; never cancel a release half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::releases are cut from main only (dispatched on $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail before tagging if the signing secret is absent: binaries refuse to
      # self-update to a release without a valid checksums.txt.sig.
      - name: Require release signing key
        env:
          VMRC_RELEASE_SIGNING_KEY: ${{ secrets.VMRC_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$VMRC_RELEASE_SIGNING_KEY" ]; then
            echo "::error::secret VMRC_RELEASE_SIGNING_KEY is not set; releases must be signed. See CONTRIBUTING.md -> Release signing key."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Also before tagging: a trial signature proves the secret parses and is one
      # of the public keys embedded in this commit (internal/selfupdate/keys/*.pub).
      - name: Check signing key matches an embedded key
        env:
          VMRC_RELEASE_SIGNING_KEY: ${{ secrets.VMRC_RELEASE_SIGNING_KEY }}
        run: |
          go run ./tools/releasesign sign -in go.mod -out "$RUNNER_TEMP/trial.sig"
          go run ./tools/releasesign verify -in go.mod -sig "$RUNNER_TEMP/trial.sig"

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="$VERSION"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$v' is not semver MAJOR.MINOR.PATCH[-prerelease] (no leading v)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists"
            exit 1
          fi
          # Export the validated value so later steps read it from the shell env
          # rather than re-interpolating the raw ${{ inputs.version }} expression.
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"

      - name: Create and push tag
        # If goreleaser later fails, the tag remains pushed; the validate step's
        # "tag already exists" guard will then block a same-version retry — delete
        # the tag (locally and on origin) and re-run, or bump the version.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VMRC_RELEASE_SIGNING_KEY: ${{ secrets.VMRC_RELEASE_SIGNING_KEY }}

      # SLSA build provenance for every archive (they are all listed in the
      # signed checksums.txt). Verify with: gh attestation verify <archive> -R pddstudio/vmrc
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
